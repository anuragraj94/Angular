<div class="container">
  <div class="card mt-3 p-2">
    <div class="row">
      <div class="col">
        <h2 class="text-center">Create New Appointment</h2>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-6">
        <input
          class="form-control"
          [(ngModel)]="newAppointmentTitle"
          placeholder="Appointment description"
        />
      </div>
      <div class="col-md-4">
        <input
          class="form-control"
          [(ngModel)]="newAppointmentDate"
          type="date"
          placeholder="Appointment date"
        />
      </div>
      <div class="col-md-2">
        <button class="btn btn-primary w-100" (click)="AddAppointment()">
          Add
        </button>
      </div>
    </div>
  </div>

  <div class="card text-center mt-4">
    <div class="card-header">Appointment Details</div>
    <div class="card-body">
      <h5 class="card-title">Appointments</h5>
    </div>
    <ul class="list-group mt-3">
      @for (item of appointments; track item.id; let index = $index) {
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
      >
        <!-- {{ item.id }} -->
        {{ item.title }}
        {{ item.date }}
        <!-- <button (click)="deleteAppointment(index)">Delete</button> -->
        <button class="btn btn-danger" (click)="deleteAppointment(item.id)">
          Delete
        </button>
      </li>
      }
    </ul>
  </div>
</div>
